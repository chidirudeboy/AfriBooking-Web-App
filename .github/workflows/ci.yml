name: CI Pipeline

on:
  push:
    branches: [ production, development ]
  pull_request:
    branches: [ production, development ]

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run build
      run: npm run build:prod
      env:
        NEXT_PUBLIC_BASE_URL: https://api.africartz.com/api
        NEXT_PUBLIC_ENV: production
        NEXT_PUBLIC_PAYSTACK_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_KEY }}
        NEXT_PUBLIC_API_TIMEOUT: 15000
        NEXT_PUBLIC_APP_NAME: AfriBooking
        NEXT_PUBLIC_DEBUG_MODE: false

  security-scan:
    runs-on: ubuntu-latest
    needs: quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build app
      run: npm run build:prod
      env:
        NEXT_PUBLIC_BASE_URL: https://api.africartz.com/api
        NEXT_PUBLIC_ENV: production
        NEXT_PUBLIC_PAYSTACK_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_KEY }}
        NEXT_PUBLIC_API_TIMEOUT: 15000
        NEXT_PUBLIC_APP_NAME: AfriBooking
        NEXT_PUBLIC_DEBUG_MODE: false

    - name: Start app and run Lighthouse
      run: |
        npm run start &
        sleep 10
        npx lighthouse http://localhost:3000 --output=json --output-path=./lighthouse-results.json --chrome-flags="--headless --no-sandbox"

    - name: Upload Lighthouse results
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-results
        path: lighthouse-results.json
